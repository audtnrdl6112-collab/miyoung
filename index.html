<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐾 뭉자 건강 기록 2021–2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    background: #F5F7FA;
    color: #1a1a2e;
    padding: 20px 16px 60px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  .header { margin-bottom: 24px; }
  .header h1 { font-size: 28px; font-weight: 800; color: #1A237E; letter-spacing: -0.02em; margin-bottom: 6px; }
  .header p  { font-size: 14px; color: #607D8B; font-weight: 500; }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-card {
    border-radius: 12px;
    padding: 12px 10px;
    text-align: center;
    border: 2px solid transparent;
  }
  .stat-label { font-size: 11px; font-weight: 700; margin-bottom: 4px; }
  .stat-value { font-size: 26px; font-weight: 800; }

  .filters {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .filter-btn {
    font-size: 13px;
    padding: 7px 16px;
    border-radius: 99px;
    border: none;
    background: #ECEFF1;
    color: #546E7A;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.15s;
  }
  .filter-btn.active {
    color: #fff;
    font-weight: 700;
    transform: scale(1.06);
  }
  .filter-btn:hover { opacity: 0.85; }

  .year-group { margin-bottom: 28px; }
  .year-label {
    font-size: 15px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.08em;
    margin-bottom: 14px;
    display: inline-block;
    padding: 5px 20px 5px 16px;
    border-radius: 0 99px 99px 0;
    background: linear-gradient(90deg, #1A237E, #3949AB);
  }

  .tl-item {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    opacity: 0;
    transform: translateX(-20px);
    transition: opacity 0.45s ease, transform 0.45s ease;
  }
  .tl-item.show { opacity: 1; transform: translateX(0); }

  .dot-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 6px;
    flex-shrink: 0;
  }
  .dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 3px solid transparent;
    flex-shrink: 0;
  }
  .line {
    width: 3px;
    flex: 1;
    min-height: 28px;
    margin-top: 4px;
    opacity: 0.45;
    border-radius: 2px;
  }

  .card {
    flex: 1;
    border: 1.5px solid transparent;
    border-radius: 14px;
    padding: 12px 16px;
    cursor: pointer;
    margin-bottom: 10px;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .card:hover { transform: translateY(-2px); }

  .card-top {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 7px;
  }
  .date-badge {
    font-size: 13px;
    font-weight: 700;
    background: white;
    padding: 2px 10px;
    border-radius: 99px;
    border: 1.5px solid transparent;
  }
  .cat-badge {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 99px;
    color: #fff;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .alert-badge {
    font-size: 12px;
    color: #fff;
    background: #C62828;
    padding: 3px 10px;
    border-radius: 99px;
    font-weight: 700;
    margin-left: auto;
  }
  .card-title {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.4;
  }
  .card-detail {
    display: none;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1.5px dashed transparent;
    font-size: 14px;
    line-height: 1.7;
    opacity: 0.85;
  }
  .card-toggle {
    font-size: 12px;
    margin-top: 6px;
    opacity: 0.6;
    font-weight: 500;
  }

  .empty {
    text-align: center;
    color: #B0BEC5;
    padding: 48px 0;
    font-size: 15px;
  }

  @media (max-width: 480px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .stat-value { font-size: 22px; }
    .header h1 { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>🐾 뭉자 건강 기록</h1>
    <p>2021 – 2026 &nbsp;·&nbsp; 카드를 클릭하면 상세 내용이 펼쳐져요</p>

      <div class="stat-value" style="color:#E65100" id="alert-count">-</div>
    </div>
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" style="background:#37474F" data-f="all">전체</button>
    <button class="filter-btn" data-f="hutugu">후두공</button>
    <button class="filter-btn" data-f="cycle">생리·주기</button>
    <button class="filter-btn" data-f="test">검사</button>

  <div id="timeline"></div>
</div>

document.getElementById('alert-count').textContent = events.filter(e=>e.alert).length + '건';

let currentFilter = 'all';

function render() {
  const filtered = events.filter(e => {
    if (currentFilter === 'all') return true;
    if (currentFilter === 'alert') return e.alert;
    if (currentFilter === 'cycle') return e.cat === 'cycle' || e.cat === 'molt';
    return e.cat === currentFilter;
  });

  const byYear = {};
  filtered.forEach(e => {
    if (!byYear[e.y]) byYear[e.y] = [];
    byYear[e.y].push(e);
  });

  const tl = document.getElementById('timeline');
  tl.innerHTML = '';

  const years = Object.keys(byYear).sort();
  if (!years.length) {
    tl.innerHTML = '<div class="empty">해당 항목이 없어요</div>';
    return;
  }

  years.forEach(y => {
    const grp = document.createElement('div');
    grp.className = 'year-group';
    grp.innerHTML = `<div class="year-label">${y}년</div>`;

    byYear[y].forEach((ev, i) => {
      const c = COLORS[ev.cat] || COLORS.test;
      const isLast = i === byYear[y].length - 1;

      const item = document.createElement('div');
      item.className = 'tl-item';

      item.innerHTML = `
        <div class="dot-col">
          <div class="dot" style="background:${c.dot};border-color:${c.border};box-shadow:0 0 0 3px ${c.bg}"></div>
          ${!isLast ? `<div class="line" style="background:${c.border}"></div>` : ''}
        </div>
        <div class="card" style="background:${c.bg};border-color:${c.border}"
             onmouseenter="this.style.boxShadow='0 4px 14px ${c.border}99'"
             onmouseleave="this.style.boxShadow='none'">
          <div class="card-top">
            <span class="date-badge" style="color:${c.text};border-color:${c.border}">${ev.date}</span>
            <span class="cat-badge" style="background:${c.dot}">${c.label}</span>
            ${ev.alert ? `<span class="alert-badge">⚠ 이상수치</span>` : ''}
          </div>
          <div class="card-title" style="color:${c.text}">${ev.title}</div>
          ${ev.detail ? `
            <div class="card-detail" style="border-color:${c.border};color:${c.text}">${ev.detail}</div>
            <div class="card-toggle" style="color:${c.text}">▼ 자세히 보기</div>
          ` : ''}
        </div>`;

      item.querySelector('.card').addEventListener('click', function() {
        const det = this.querySelector('.card-detail');
        const tog = this.querySelector('.card-toggle');
        if (!det) return;
        const open = det.style.display === 'block';
        det.style.display = open ? 'none' : 'block';
        if (tog) tog.textContent = open ? '▼ 자세히 보기' : '▲ 접기';
      });

      grp.appendChild(item);
      setTimeout(() => item.classList.add('show'), i * 60);
    });

    tl.appendChild(grp);
  });
}

document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  const f = btn.dataset.f;
  currentFilter = f;

  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.remove('active');
    b.style.background = '#ECEFF1';
    b.style.color = '#546E7A';
  });
  btn.classList.add('active');
  const fc = FILTER_COLORS[f] || '#37474F';
  btn.style.background = fc;
  btn.style.color = '#fff';

  render();
});

render();
</script>
</body>
</html>
