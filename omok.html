    <div id="win-modal" style="display: none;">
        <div id="win-message"></div>
        <button class="action-btn" onclick="resetGame()">한 판 더!</button>
    </div>

    <script>
        // --- 게임 설정 ---
        const BOARD_SIZE = 15;
        const boardElement = document.getElementById('board');
        const turnText = document.getElementById('turn-text');
        const turnIcon = document.getElementById('turn-icon');
        const statusBar = document.getElementById('status-bar');
        const winModal = document.getElementById('win-modal');
        const winMessage = document.getElementById('win-message');
        const imgInput = document.getElementById('imgInput');

        let boardState = []; // 0:빈칸, 1:플레이어(흑), 2:AI(백)
        let gameActive = true;
        let isPlayerTurn = true; // 플레이어 선공
        let isImageLoaded = false;

        // --- 오디오 & 진동 ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playStoneSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const t = audioCtx.currentTime;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(1000, t);
            osc.frequency.exponentialRampToValueAtTime(100, t + 0.1);
            gain.gain.setValueAtTime(0.5, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.1);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(200, t);
            gain2.gain.setValueAtTime(0.3, t);
            gain2.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(t);
            osc2.stop(t + 0.15);
        }

        function vibrate(pattern) {
            if (navigator.vibrate) navigator.vibrate(pattern);
        }

        // --- 이미지 처리 ---
        imgInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.documentElement.style.setProperty('--mungja-image', `url(${event.target.result})`);
                    isImageLoaded = true;
                    updateTurnUI();
                };
                reader.readAsDataURL(file);
            }
        });

        function saveForSharing() {
            if (!isImageLoaded && !confirm("뭉자 사진이 없습니다. 기본값으로 저장할까요?")) return;

            const currentImgVar = getComputedStyle(document.documentElement).getPropertyValue('--mungja-image');
            let htmlContent = document.documentElement.outerHTML;
            const injectionStyle = `
                :root { --mungja-image: ${currentImgVar} !important; }
                #controls { display: none !important; }
            `;
            const newHtml = htmlContent.replace('</head>', `<style>${injectionStyle}</style></head>`);
            const blob = new Blob([newHtml], {type: 'text/html'});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '뭉자오목_싱글.html';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // --- 게임 로직 ---
        function initGame() {
            boardState = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
            boardElement.innerHTML = '';
            gameActive = true;
            isPlayerTurn = true;
            winModal.style.display = 'none';

            // 화점
            [3, 7, 11].forEach(y => {
                [3, 7, 11].forEach(x => {
                    const star = document.createElement('div');
                    star.className = 'star-point';
                    star.style.left = `calc(${(x) * (100/15) + (100/30)}%)`;
                    star.style.top = `calc(${(y) * (100/15) + (100/30)}%)`;
                    boardElement.appendChild(star);
                });
            });

            // 셀 생성
            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.x = x;
                    cell.dataset.y = y;
                    cell.onclick = () => playerMove(x, y);
                    boardElement.appendChild(cell);
                }
            }
            updateTurnUI();
        }

        function updateTurnUI() {
            const mungjaImg = getComputedStyle(document.documentElement).getPropertyValue('--mungja-image');
            
            if (isPlayerTurn) {
                turnText.innerText = "뭉자의 차례 (흑)";
                turnIcon.style.backgroundImage = mungjaImg;
                turnIcon.style.backgroundColor = "#111";
                statusBar.className = "my-turn";
            } else {
                turnText.innerText = "상대방 차례 (백)";
                turnIcon.style.backgroundImage = "none";
                turnIcon.style.backgroundColor = "#fff";
                statusBar.className = "ai-turn";
            }
        }

        function placeVisualStone(x, y, player) {
            const cell = document.querySelector(`.cell[data-x="${x}"][data-y="${y}"]`);
            if (cell.querySelector('.stone')) return;

            const stone = document.createElement('div');
            stone.className = `stone ${player === 1 ? 'black' : 'white'}`;
            
            // 마지막 수 표시 갱신
            document.querySelectorAll('.last-move').forEach(el => el.classList.remove('last-move'));
            stone.classList.add('last-move');

            cell.appendChild(stone);
            requestAnimationFrame(() => stone.classList.add('placed'));
            playStoneSound();
            
            if (player === 1) vibrate(30); // 사용자 턴일 때만 짧은 진동
        }

        function playerMove(x, y) {
            if (!gameActive || !isPlayerTurn || boardState[y][x] !== 0) return;

            // 1. 착수
            boardState[y][x] = 1;
            placeVisualStone(x, y, 1);

            // 2. 승리 체크
            if (checkWin(x, y, 1)) {
                endGame(1);
                return;
            }

            // 3. AI 턴으로 전환
            isPlayerTurn = false;
            updateTurnUI();
            
            // AI 생각하는 척 지연
            setTimeout(aiMove, 600);
        }

        // --- AI 알고리즘 (Heuristic Evaluation) ---
        function aiMove() {
            if (!gameActive) return;

            // 가능한 모든 수에 대해 점수 계산
            let maxScore = -1;
            let bestMoves = [];

            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    if (boardState[y][x] === 0) {
                        // 돌이 있는 곳 주변만 탐색 (성능 최적화)
                        if (!hasNeighbor(x, y)) continue;

                        // 점수: (AI 공격 점수) + (플레이어 방어 점수 * 가중치)
                        // 플레이어를 막는 것을 1.2배 더 중요하게 생각함 (방어적 AI)
                        const attackScore = evaluatePoint(x, y, 2); 
                        const defenseScore = evaluatePoint(x, y, 1); 
                        const currentScore = attackScore + (defenseScore * 1.2);

                        if (currentScore > maxScore) {
                            maxScore = currentScore;
                            bestMoves = [{x, y}];
                        } else if (currentScore === maxScore) {
                            bestMoves.push({x, y});
                        }
                    }
                }
            }

            // 둘 곳이 없으면 중앙 근처에 둠 (첫 수 대응)
            if (bestMoves.length === 0) {
                const center = Math.floor(BOARD_SIZE / 2);
                if (boardState[center][center] === 0) bestMoves.push({x: center, y: center});
                else bestMoves.push({x: center+1, y: center+1});
            }

            // 같은 점수면 랜덤 선택
            const move = bestMoves[Math.floor(Math.random() * bestMoves.length)];
            
            // AI 착수
            boardState[move.y][move.x] = 2;
            placeVisualStone(move.x, move.y, 2);

            if (checkWin(move.x, move.y, 2)) {
                endGame(2);
            } else {
                isPlayerTurn = true;
                updateTurnUI();
            }
        }

        // 주변에 돌이 있는지 확인 (최적화용)
        function hasNeighbor(x, y) {
            const range = 2;
            for (let dy = -range; dy <= range; dy++) {
                for (let dx = -range; dx <= range; dx++) {
                    if (dx === 0 && dy === 0) continue;
                    const nx = x + dx, ny = y + dy;
                    if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE) {
                        if (boardState[ny][nx] !== 0) return true;
                    }
                }
            }
            return false;
        }

        // 특정 위치의 가치 평가 (점수 계산)
        function evaluatePoint(x, y, player) {
            let score = 0;
            const directions = [[1, 0], [0, 1], [1, 1], [1, -1]];

            for (const [dx, dy] of directions) {
                // 해당 방향으로 몇 개가 연속되는지, 막혔는지 확인
                score += getLineScore(x, y, dx, dy, player);
            }
            return score;
        }

        function getLineScore(x, y, dx, dy, player) {
            let count = 1; // 현재 위치 포함
            let blockedEnds = 0;

            // 정방향 탐색
            let i = 1;
            while (true) {
                const nx = x + dx * i;
                const ny = y + dy * i;
                if (nx < 0 || nx >= BOARD_SIZE || ny < 0 || ny >= BOARD_SIZE) {
                    blockedEnds++; break;
                }
                const cell = boardState[ny][nx];
                if (cell === player) { count++; }
                else if (cell === 0) { break; } // 빈칸이면 연속 끝
                else { blockedEnds++; break; } // 상대 돌이면 막힘
                i++;
            }

            // 역방향 탐색
            i = 1;
            while (true) {
                const nx = x - dx * i;
                const ny = y - dy * i;
                if (nx < 0 || nx >= BOARD_SIZE || ny < 0 || ny >= BOARD_SIZE) {
                    blockedEnds++; break;
                }
                const cell = boardState[ny][nx];
                if (cell === player) { count++; }
                else if (cell === 0) { break; }
                else { blockedEnds++; break; }
                i++;
            }

            // 점수 부여 로직
            if (count >= 5) return 100000; // 5목 (승리)
            if (count === 4) {
                if (blockedEnds === 0) return 10000; // 열린 4 (다음 수 승리 확정)
                if (blockedEnds === 1) return 1000;  // 닫힌 4 (막아야 함)
            }
            if (count === 3) {
                if (blockedEnds === 0) return 1000;  // 열린 3 (매우 위험)
                if (blockedEnds === 1) return 100;   // 닫힌 3
            }
            if (count === 2) {
                if (blockedEnds === 0) return 100;
                if (blockedEnds === 1) return 10;
            }
            return 1;
        }

        function checkWin(x, y, player) {
            const directions = [[1, 0], [0, 1], [1, 1], [1, -1]];
            for (const [dx, dy] of directions) {
                let count = 1;
                for (let i = 1; i < 5; i++) {
                    const nx = x + dx * i, ny = y + dy * i;
                    if (nx < 0 || nx >= BOARD_SIZE || ny < 0 || ny >= BOARD_SIZE) break;
                    if (boardState[ny][nx] !== player) break;
                    count++;
                }
                for (let i = 1; i < 5; i++) {
                    const nx = x - dx * i, ny = y - dy * i;
                    if (nx < 0 || nx >= BOARD_SIZE || ny < 0 || ny >= BOARD_SIZE) break;
                    if (boardState[ny][nx] !== player) break;
                    count++;
                }
                if (count >= 5) return true;
            }
            return false;
        }

        function endGame(winner) {
            gameActive = false;
            if (winner === 1) {
                winMessage.innerText = "🎉 뭉자 승리! 🎉\n역시 최고야!";
                vibrate([100, 50, 100, 50, 200]);
            } else {
                winMessage.innerText = "😭 뭉자 패배...\nAI가 너무 잘하네요";
            }
            winModal.style.display = 'flex';
        }

        function resetGame() {
            initGame();
        }

        // 게임 시작
        initGame();
    </script>
